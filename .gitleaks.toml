# Secret-scan configuration, used by CI, the pre-commit hook and `make secrets`.
#
# controlzee works with CloudTrail logs, so its tests and fixtures contain fake AWS access key ids on
# purpose (the AKIAIOSFODNN7... family, modelled on the example key in AWS's documentation). Each path
# below is allowed exactly and says why. A new file with secret-shaped text is NOT covered: add it here
# with a reason, or the scan fails.

[extend]
useDefault = true

[allowlist]
description = "Fake AWS key ids held on purpose in the weak-indicator scenario"
paths = [
  # The scenario that matches on a weak indicator, generated by tests/builders from the builder below.
  '''^tests/builders/scenarios\.py$''',
  '''^tests/fixtures/05_weak_ioc/''',
  # The published example report built from that scenario.
  '''^docs/examples/05_weak_ioc\.html$''',
  # A unit test that feeds a secret-shaped key id to the sanitizer.
  '''^tests/unit/test_sanitize\.py$''',
]
